services:
  mumuainovel:
    build:
      context: .
      dockerfile: Dockerfile
    image: mumuainovel-sqlite:local
    container_name: mumuainovel
    init: true
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./logs:/app/logs
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 容器内始终监听所有网卡；本机源码运行仍可使用 127.0.0.1。
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      # 固定容器路径，避免读取宿主机 .env 中的本地数据库绝对路径。
      DATABASE_URL: sqlite+aiosqlite:////app/data/mumu.db
      DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-openai}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-6-sol}
      # 默认通过 HTTP 访问；配置 HTTPS 后可在 .env 中设为 true。
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
